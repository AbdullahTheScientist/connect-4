experiment:
  name: default
  seed: 42
  deterministic: true

game:
  rows: 6
  columns: 7
  connect: 4

model:
  channels: 64
  residual_blocks: 4
  input_channels: 2

mcts:
  simulations: 50
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  temperature: 1.0
  temperature_moves: 12

selfplay:
  games_per_iteration: 50
  workers: 1
  temperature: 1.0
  temperature_moves: 12
  save_examples: true

training:
  iterations: 50
  epochs: 5
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  l2_coefficient: 0.0001
  gradient_clip: 1.0
  replay_capacity: 50000
  min_buffer_size: 256
  max_batches_per_epoch: 64
  lr_step_size: 999
  lr_gamma: 0.5
  save_buffer: true
  checkpoint_every: 1

evaluation:
  candidate_games: 20
  random_games: 20
  tactical_games: 20
  simulations: 50
  promotion_threshold: 0.55
  temperature: 0.0

paths:
  checkpoints: checkpoints
  logs: logs
  results: results

ui:
  width: 1280
  height: 800
  fps: 60
  animation_speed: 900
  default_simulations: 50

tensorboard:
  enabled: true
